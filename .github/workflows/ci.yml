name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Sensitive information check
        run: npm run sanitize

      - name: Repository contribution contracts
        run: npm run check:repo

      - name: Test
        run: npm test

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Pack dry-run
        run: npm pack --dry-run
