name: 规则质量反馈
description: 只提交版本、ruleId、判断和处置结果；不接收配置、路径、端点、凭证、报告或自由文本
title: "[Rule feedback] "
labels:
  - rule-feedback
body:
  - type: markdown
    attributes:
      value: |
        每个 Issue 只反馈一条规则，并保留标题前缀。此表单不会自动读取或上传本机信息。不要附加完整配置、JSON/HTML 报告、诊断、截图、路径、端点、taskId、API Key、Token、私钥或其它自由文本。

  - type: input
    id: product_version
    attributes:
      label: 产品版本
      description: 运行当前产品的 `--version` 获取，只填写版本号。
      placeholder: 0.0.6-pilot.4
    validations:
      required: true

  - type: input
    id: rule_id
    attributes:
      label: 规则 ID
      description: 只填写扫描结果中的稳定 ruleId，不填写 taskId。
      placeholder: GEMINI_MCP_TRUST_BYPASS
    validations:
      required: true

  - type: dropdown
    id: judgment
    attributes:
      label: 判断
      options:
        - expected
        - false-positive
        - unclear
    validations:
      required: true

  - type: dropdown
    id: action_outcome
    attributes:
      label: 处置结果
      options:
        - not-attempted
        - resolved
        - mitigated
        - still-present
        - accepted
        - ignored
        - abandoned
    validations:
      required: true

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附加配置、报告、诊断、截图、路径、端点、taskId、凭证或其它自由文本。
          required: true
