appId: app.reveal.desktop
productName: AgentReveal
directories:
  output: release
afterPack: scripts/after-pack.cjs
extraMetadata:
  main: desktop/main.cjs
files:
  - package.json
  - bin/**/*
  - dist/**/*
  - desktop/**/*
asar: true
mac:
  icon: desktop/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "12.0"
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: AgentReveal-${version}-${arch}.${ext}
  sign: false
compression: maximum
