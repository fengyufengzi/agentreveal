appId: com.agentguard.desktop
productName: AgentGuard
directories:
  output: release
extraMetadata:
  main: desktop/main.cjs
files:
  - package.json
  - bin/**/*
  - dist/**/*
  - desktop/**/*
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: AgentGuard-${version}-${arch}.${ext}
  sign: false
compression: maximum
